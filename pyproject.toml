[project]
name = "whisperer"
version = "0.1.0"
description = "Local voice input with Whisper — Typeless alternative"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper>=0.4.0",
    "numpy>=2.4.3",
    "pyobjc-framework-Cocoa>=11.0",
    "pynput>=1.8.1",
    "pyperclip>=1.11.0",
    "sounddevice>=0.5.5",
]
